<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 520" width="600" height="520" role="img" aria-label="Ілюстрація: розріз будинку з водяною трубою, електропроводкою та сонячними панелями на даху">
  <title>Ілюстрація: розріз будинку з трубою, проводкою та сонячними панелями</title>
  <ellipse cx="300" cy="486" rx="270" ry="16" fill="#063B69" opacity=".08"/>

  <!-- sun -->
  <g stroke="#FFD600" stroke-width="8" stroke-linecap="round">
    <path d="M520 20v-10M520 120v10M470 70h-10M570 70h10M485 35l-8-8M555 105l8 8M555 35l8-8M485 105l-8 8"/>
  </g>
  <circle cx="520" cy="70" r="32" fill="#FFD600"/>

  <!-- wall cutaway -->
  <rect x="80" y="210" width="440" height="266" rx="6" fill="#fff" stroke="#063B69" stroke-width="6"/>
  <path d="M80 440H520" stroke="#063B69" stroke-width="4"/>

  <!-- roof and solar panels -->
  <path d="M44 214 300 46l256 168z" fill="#063B69" stroke="#063B69" stroke-width="8" stroke-linejoin="round"/>
  <g fill="#2E9E6B" stroke="#fff" stroke-width="3" stroke-linejoin="round">
    <path d="M364 88l64 42-19 28-64-42z"/>
    <path d="M441 138l64 42-19 28-64-42z"/>
  </g>
  <g stroke="#fff" stroke-width="1.6" opacity=".7">
    <path d="M385 102l-19 28M407 116l-19 28M354 102l64 42"/>
    <path d="M462 152l-19 28M484 166l-19 28M432 152l64 42"/>
  </g>

  <!-- plumbing: pipe, water heater -->
  <g fill="none" stroke="#1B7FC4" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <path d="M150 214V450"/>
    <path d="M150 330H290"/>
    <path d="M330 390v62"/>
  </g>
  <g fill="#fff" stroke="#063B69" stroke-width="4">
    <circle cx="150" cy="330" r="9"/>
    <circle cx="150" cy="260" r="9"/>
  </g>
  <rect x="290" y="250" width="80" height="140" rx="34" fill="#EAF5FC" stroke="#063B69" stroke-width="5"/>
  <circle cx="330" cy="290" r="14" fill="#fff" stroke="#063B69" stroke-width="4"/>
  <path d="M330 290l7-7" stroke="#063B69" stroke-width="3.5" stroke-linecap="round"/>

  <!-- electrical: lamp, cable, socket -->
  <g fill="none" stroke="#FFD600" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M232 214v50"/>
    <path d="M440 214v50"/>
  </g>
  <circle cx="232" cy="282" r="18" fill="#FFD600" stroke="#063B69" stroke-width="4"/>
  <rect x="418" y="262" width="46" height="46" rx="12" fill="#fff" stroke="#063B69" stroke-width="4"/>
  <path d="M431 278v8M451 278v8M431 296c5 4 15 4 20 0" stroke="#063B69" stroke-width="3.5" stroke-linecap="round" fill="none"/>

  <!-- solar: cable to inverter -->
  <path d="M496 208v152" fill="none" stroke="#2E9E6B" stroke-width="7" stroke-linecap="round"/>
  <rect x="470" y="360" width="52" height="46" rx="8" fill="#fff" stroke="#063B69" stroke-width="4"/>
  <path d="M484 383h24" stroke="#2E9E6B" stroke-width="5" stroke-linecap="round"/>
</svg>
